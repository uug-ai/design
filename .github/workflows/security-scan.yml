name: Security scan

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  security-scan:
    uses: uug-ai/workflows/.github/workflows/release-create.yml@787d9128bd488896a61e390c84a3d47794e6817f
    with:
      project: ${{ github.event.repository.name }}
      docker_context: "."
      hardened: true
      hardened_profile: frontend
      use_private_module_auth: false
      publish: false
      runner_matrix: '[{"architecture":"amd64","runner":"ubuntu-24.04"},{"architecture":"arm64","runner":"ubuntu-24.04-arm"}]'
    secrets: inherit